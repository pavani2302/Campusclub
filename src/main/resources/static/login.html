
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>Login - Campus Club</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >
</head>

<body>

<div class="auth">

    <div class="auth-card">

        <a class="back" href="/">
            ← Home
        </a>

        <h1>Welcome back</h1>

        <p>Login to Campus Club</p>

        <form id="loginForm">

            <input
                id="email"
                type="email"
                placeholder="Email"
                autocomplete="email"
                required
            >

            <input
                id="password"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <button
                type="submit"
                class="btn"
            >
                Login
            </button>

        </form>

        <div id="msg"></div>

        <div class="demo">

            <b>Demo accounts</b>

            <br>

            Admin:
            admin@campusclub.com
            /
            admin123

            <br>

            Student:
            student@campusclub.com
            /
            student123

        </div>

        <p>
            New student?
            <a href="/register.html">
                Create account
            </a>
        </p>

    </div>

</div>

<script src="/js/app.js"></script>

<script>

const loginForm =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const message =
    document.getElementById("msg");

loginForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        message.textContent = "";
        message.className = "";

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        const result = await api(
            "/api/auth/login",
            "POST",
            {
                email: email,
                password: password
            }
        );

        if (result.ok) {

            message.textContent =
                "Login successful. Redirecting...";

            message.className =
                "success";

            window.location.href =
                "/dashboard.html";

        } else {

            message.textContent =
                result.data.message ||
                "Login failed";

            message.className =
                "error";
        }
    }
);

</script>

</body>
</html>
