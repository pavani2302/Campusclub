<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="auth"><div class="auth-card"><a class="back" href="/">← Home</a><h1>Welcome back</h1><p>Login to Campus Club</p><form id="loginForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button class="btn">Login</button></form><div id="msg"></div><div class="demo"><b>Demo accounts</b><br>Admin: admin@campusclub.com / admin123<br>Student: student@campusclub.com / student123</div><p>New student? <a href="/register.html">Create account</a></p></div></div><script src="/js/app.js"></script><script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const r=await api('/api/auth/login','POST',{email:email.value,password:password.value});if(r.ok){location.href='/dashboard.html'}else{msg.textContent=r.data.message||'Login failed';msg.className='error'}})</script></body></html>
