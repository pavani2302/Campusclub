<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title><link rel="stylesheet" href="/css/style.css"></head><body><header><div class="brand">Campus<span>Club</span></div><nav><span id="userName"></span><button id="logout" class="linkbtn">Logout</button></nav></header><main class="container"><div class="welcome"><div><p class="tag">DASHBOARD</p><h1>Welcome, <span id="welcomeName"></span> 👋</h1><p>Manage your campus club activities from one place.</p></div><div id="roleBadge" class="badge"></div></div><section id="adminPanel" class="hidden"><h2>Admin Overview</h2><div class="stats" id="stats"></div><div class="admin-grid"><div class="panel"><h3>Create Club</h3><form id="clubForm"><input id="clubName" placeholder="Club name" required><input id="clubCategory" placeholder="Category"><input id="clubCoordinator" placeholder="Coordinator"><textarea id="clubDescription" placeholder="Description" required></textarea><button class="btn">Create Club</button></form></div><div class="panel"><h3>Create Event</h3><form id="eventForm"><input id="eventTitle" placeholder="Event title" required><input id="eventDate" placeholder="2026-10-20 10:00" required><input id="eventVenue" placeholder="Venue" required><select id="eventClub"></select><textarea id="eventDescription" placeholder="Description" required></textarea><button class="btn">Create Event</button></form></div></div></section><section><div class="section-head"><h2>Clubs</h2><span id="clubMsg"></span></div><div id="clubs" class="grid"></div></section><section><div class="section-head"><h2>Upcoming Events</h2></div><div id="events" class="grid"></div></section><section><h2>My Event Registrations</h2><div id="mine"></div></section></main><script src="/js/app.js"></script><script src="/js/dashboard.js"></script></body></html>
