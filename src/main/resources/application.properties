spring.application.name=campus-club-management

server.port=${PORT:8080}

# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/campusclub;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# =========================================================
# H2 CONSOLE - LOCAL DEVELOPMENT
# =========================================================

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =========================================================
# ERROR HANDLING
# =========================================================

server.error.include-message=always

# =========================================================
# EMAIL
# =========================================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

campusclub.mail.from=${MAIL_FROM:${MAIL_USERNAME}}